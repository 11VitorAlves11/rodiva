name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rodiva
          POSTGRES_PASSWORD: rodiva
          POSTGRES_DB: rodiva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rodiva -d rodiva_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://rodiva:rodiva@localhost:5432/rodiva_test
      ENVIRONMENT: test
      SECRET_KEY: ci-only-not-a-real-secret
      AUTH_MODE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types
        run: mypy app
      - name: Migrations
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (eslint · vitest · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: End to end (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The journey is only worth testing against the real thing: the API, the
      # database and the app, brought up the way a deployment brings them up.
      - name: Start the stack
        run: docker compose -f docker-compose.dev.yml up -d --build
      - name: Wait for the app
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/health > /dev/null \
               && curl -sf http://localhost:5173 > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "The stack did not come up in time" >&2
          docker compose -f docker-compose.dev.yml logs --tail 50
          exit 1
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Tests
        run: npm run test:e2e
        working-directory: frontend
      - name: Keep the failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: frontend/test-results/
          retention-days: 7
